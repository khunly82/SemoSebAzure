name: cicd

on:
    push:
        branches: ['main']
    workflow_dispatch:

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v5
              with:
                dotnet-version: 10.x
            - name: Restore Dependency
              run: dotnet restore
            - name: Build
              run: dotnet build --configuration release
            - name: Publish
              run: dotnet publish --output ./publish --configuration release 
            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                name: build
                path: ./publish

    deploy:
        runs-on: ubuntu-latest
        needs: [build]
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v8
              with:
                name: build
                path: ./publish
            - name: Login Azure
              uses: azure/login@v3
              with:
                creds: ${{secrets.AZURE_CREDENTIALS}}
            - name: Upload Azure 
              uses: azure/webapps-deploy@v2
              with:
                app-name: seb-asp-2026
                package: ./publish
